[project]
name = "agent-relay"
version = "0.1.0"
description = "Constrained MCP relay for explicitly enabled local capabilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "cua-driver==0.19.3",
    "mcp>=1.28.1,<2",
    "pydantic>=2.8,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
    "websockets>=13,<16",
]

[project.scripts]
agent-relay = "agent_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6,<8",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real loopback network tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
