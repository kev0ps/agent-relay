# Simple one-listener MVP deployment for a Linux host.
# Keep credentials in the ignored .env file, never in this file.
services:
  relay-server:
    build: .
    image: agent-relay
    command: ["server", "run"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RELAY_SERVER_HOST: "0.0.0.0"
      RELAY_SERVER_PORT: "8000"
      RELAY_MCP_TOKEN: "${RELAY_MCP_TOKEN:?set RELAY_MCP_TOKEN}"
      RELAY_AGENT_TOKEN: "${RELAY_AGENT_TOKEN:?set RELAY_AGENT_TOKEN}"
      RELAY_ALLOW_INSECURE_WS: "${RELAY_ALLOW_INSECURE_WS:-true}"
