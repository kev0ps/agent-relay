---
# Immutable action SHAs necessarily exceed yamllint's default line limit.
# yamllint disable rule:line-length
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install locked Python environment
        uses: ./.github/actions/setup-python

      - name: Check formatting and lint
        run: uv run --frozen ruff check .

      - name: Run test suite with informational coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/agent-relay.coverage
        run: >-
          uv run --frozen pytest -q -m "not integration"
          --cov=agent_relay --cov-report=term-missing

      - name: Run explicit integration suite
        run: uv run --frozen pytest -q -m integration

      - name: Verify checks left the repository clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  container:
    name: Docker image smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
            runner_arch: x86_64
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            runner_arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.runner_arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and load image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: agent-relay:ci-${{ matrix.suffix }}

      - name: Verify image contract
        env:
          IMAGE: agent-relay:ci-${{ matrix.suffix }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "relay"
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.Entrypoint}}')" = '["agent-relay"]'
          test "$(docker image inspect "$IMAGE" --format '{{json .Config.ExposedPorts}}')" = 'null'

      - name: Smoke-test both roles
        env:
          IMAGE: agent-relay:ci-${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform="$PLATFORM" "$IMAGE" --help
          docker run --rm --platform="$PLATFORM" "$IMAGE" --version

  relay-compose-link:
    name: Relay Compose Link - Server / Linux Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install locked Python environment
        uses: ./.github/actions/setup-python
        with:
          installer: "true"

      - name: Start Compose Server and verify relay_device_status via MCP
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/relay-compose-link"
          env_file="$runtime_dir/.env"
          mcp_token_file="$runtime_dir/mcp.token"
          agent_token_file="$runtime_dir/agent.token"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          umask 077
          openssl rand -hex 32 > "$mcp_token_file"
          openssl rand -hex 32 > "$agent_token_file"
          {
            printf 'RELAY_MCP_TOKEN='
            cat "$mcp_token_file"
            printf '\nRELAY_AGENT_TOKEN='
            cat "$agent_token_file"
            printf '\nRELAY_ALLOW_INSECURE_WS=true\n'
          } > "$env_file"
          docker compose --env-file "$env_file" config --quiet
          docker compose --env-file "$env_file" up --build --detach
          uv run --frozen python scripts/relay_compose_link.py \
            --mcp-token-file "$mcp_token_file" \
            --agent-token-file "$agent_token_file" \
            --workspace "$runtime_dir/workspace" \
            --home "$runtime_dir/home"

      - name: Stop Compose Server and remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/relay-compose-link"
          env_file="$runtime_dir/.env"
          if test -f "$env_file"; then
            docker compose --env-file "$env_file" down
          fi
          rm -f "$runtime_dir/.env" "$runtime_dir/mcp.token" "$runtime_dir/agent.token"

  e2e-linux:
    name: Linux Terminal end-to-end
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install locked E2E environment and Agent Relay runtime
        uses: ./.github/actions/setup-python
        with:
          installer: "true"

      - name: Run Linux contract tests
        run: uv run --frozen pytest -q tests/test_linux_e2e.py tests/test_runner.py

      - name: Run Linux integration suite
        run: uv run --frozen pytest -q -m integration

      - name: Run Linux Terminal MCP end-to-end scenario
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/linux-terminal-evidence"
          mkdir -p "$evidence_dir"
          uv run --frozen python scripts/linux_e2e.py \
            --evidence-dir "$evidence_dir" \
            --output-file "$evidence_dir/output.log"

      - name: Validate bounded Linux evidence
        id: validate-linux-terminal-evidence
        if: always()
        run: >-
          python scripts/validate_e2e_evidence.py
          --profile linux-terminal
          --evidence-dir linux-terminal-evidence

      - name: Upload bounded Linux evidence
        if: always() && steps.validate-linux-terminal-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-terminal-e2e-evidence
          path: linux-terminal-evidence/**
          if-no-files-found: warn
          retention-days: 7

  e2e-linux-cua:
    name: Linux CUA end-to-end
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Linux desktop prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core dbus-x11 gir1.2-atspi-2.0 libatk-bridge2.0-0 \
            chromium libglib2.0-bin openbox x11-utils xdotool xterm xvfb wget
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/google-linux.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends google-chrome-stable

      - name: Verify Linux CUA browser prerequisite
        run: |
          set -euo pipefail
          command -v google-chrome-stable
          google-chrome-stable --version

      - name: Install locked CUA environment
        uses: ./.github/actions/setup-python

      - name: Prepare isolated Linux CUA driver state
        shell: bash
        run: |
          set -euo pipefail
          driver="$(uv run --frozen python -c 'import cua_driver; print(cua_driver.get_binary_path())')"
          test -f "$driver"
          set +e
          timeout --signal=TERM --kill-after=5s 15s "$driver" --version >/dev/null 2>&1
          driver_status=$?
          set -e
          if [ "$driver_status" -ne 0 ]; then
            printf 'cua-driver version probe failed with status=%s\n' "$driver_status" >&2
            exit "$driver_status"
          fi
          driver_home="$RUNNER_TEMP/agent-relay-cua-driver-home"
          mkdir -p "$driver_home"
          {
            printf 'CUA_DRIVER_RS_HOME=%s\n' "$driver_home"
            printf 'CUA_DRIVER_TELEMETRY_HOME=%s\n' "$driver_home"
          } >> "$GITHUB_ENV"

      - name: Probe Linux CUA MCP JSON-RPC startup
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 20s \
            uv run --frozen python scripts/probe_cua_driver.py --platform linux

      - name: Run Linux CUA contract tests
        run: uv run --frozen pytest -q tests/test_linux_computer_e2e.py tests/test_computer_capability.py tests/test_desktop_fixture.py

      - name: Run Linux CUA end-to-end scenario
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$GITHUB_WORKSPACE/linux-cua-evidence"
          mkdir -p "$evidence_dir"
          uv run --frozen python scripts/linux_computer_e2e.py \
            --evidence-dir "$evidence_dir" \
            --output-file "$evidence_dir/output.log"

      - name: Validate bounded Linux CUA evidence
        id: validate-linux-cua-evidence
        if: always()
        run: >-
          python scripts/validate_e2e_evidence.py
          --profile linux-cua
          --evidence-dir linux-cua-evidence

      - name: Upload bounded Linux CUA evidence
        if: always() && steps.validate-linux-cua-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-cua-e2e-evidence
          path: linux-cua-evidence/**
          if-no-files-found: warn
          retention-days: 7

  e2e-windows-terminal:
    name: Windows Terminal end-to-end
    needs: python
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checked-out commit does not match the expected workflow SHA"
          }

      - name: Install locked E2E environment and Agent Relay runtime
        uses: ./.github/actions/setup-python
        with:
          installer: "true"

      - name: Run Windows test suite
        shell: pwsh
        run: >-
          uv run --frozen pytest -q tests/test_windows_e2e.py
          tests/test_installers.py tests/test_cli_uninstall.py
          tests/test_cli_config.py::test_init_agent_from_server_uses_the_effective_dotenv_token
          tests/test_runner.py
          -k "not git_search_skips_relative_default_path_entries"

      - name: Run Windows integration suite
        shell: pwsh
        run: uv run --frozen pytest -q -m integration

      - name: Run Windows Terminal MCP end-to-end scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "windows-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          uv run --frozen python scripts/windows_e2e.py `
            --evidence-dir $evidenceDir `
            --output-file (Join-Path $evidenceDir "output.log")

      - name: Validate bounded Windows evidence
        id: validate-windows-evidence
        if: always()
        run: >-
          python scripts/validate_e2e_evidence.py
          --profile windows-terminal
          --evidence-dir windows-evidence

      - name: Upload bounded Windows evidence
        if: always() && steps.validate-windows-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-terminal-e2e-evidence
          path: windows-evidence/**
          if-no-files-found: warn
          retention-days: 7

  e2e-windows-cua:
    name: Windows CUA end-to-end
    needs: python
    runs-on: windows-2025
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checked-out commit does not match the expected workflow SHA"
          }

      - name: Verify interactive Windows session
        shell: pwsh
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          if ($sessionId -eq 0) {
            throw "The Windows CUA runner is in Session 0; no interactive desktop is available"
          }
          Write-Host "Windows CUA interactive session: $sessionId"

      - name: Install locked Python environment
        uses: ./.github/actions/setup-python

      - name: Verify automatic CUA driver resolution
        shell: pwsh
        run: |
          $driver = (uv run --frozen python -c "import cua_driver; print(cua_driver.get_binary_path())").Trim()
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "cua-driver binary was not resolved automatically"
          }

      - name: Probe Windows CUA daemon-backed MCP startup
        shell: pwsh
        run: uv run --frozen python scripts/probe_cua_driver.py --platform windows

      - name: Run Windows CUA contract tests
        shell: pwsh
        run: >-
          uv run --frozen pytest -q tests/test_windows_computer_e2e.py tests/test_windows_e2e.py tests/test_runner.py
          -k "not git_search_skips_relative_default_path_entries"

      - name: Run Windows CUA Agent Relay end-to-end scenario
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "windows-cua-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          uv run --frozen python scripts/windows_computer_e2e.py `
            --evidence-dir $evidenceDir `
            --output-file (Join-Path $evidenceDir "output.log")

      - name: Validate bounded Windows CUA evidence
        id: validate-windows-cua-evidence
        if: always()
        run: >-
          python scripts/validate_e2e_evidence.py
          --profile windows-cua
          --evidence-dir windows-cua-evidence

      - name: Upload bounded Windows CUA evidence
        if: always() && steps.validate-windows-cua-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-cua-e2e-evidence
          path: windows-cua-evidence/**
          if-no-files-found: warn
          retention-days: 7
