name: Set up locked Python environment
description: Set up the locked Agent Relay Python environment or bootstrap the runtime

inputs:
  installer:
    description: Run the Agent Relay user installer and expose its command for a native E2E harness
    required: false
    default: "false"
  cua:
    description: Install the optional CUA provider dependency
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      if: inputs.installer != 'true'
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        version: "0.11.6"
        python-version: "3.13.5"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Verify committed lockfile
      if: inputs.installer != 'true'
      shell: bash
      run: uv lock --check

    - name: Install locked dependencies without CUA
      if: inputs.installer != 'true' && inputs.cua != 'true'
      shell: bash
      run: uv sync --locked

    - name: Install locked dependencies with CUA
      if: inputs.installer != 'true' && inputs.cua == 'true'
      shell: bash
      run: uv sync --locked --extra cua

    - name: Install Agent Relay runtime through the Linux bootstrapper
      if: inputs.installer == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        AGENT_RELAY_SETUP: skip
        AGENT_RELAY_SKIP_PATH_UPDATE: "1"
        AGENT_RELAY_SYNC_ROOT: ${{ github.workspace }}
      run: |
        set -euo pipefail
        archive_source="$RUNNER_TEMP/agent-relay-source.tar.gz"
        tar --exclude=.git --exclude=.venv --exclude=.pytest_cache \
          -czf "$archive_source" -C "$GITHUB_WORKSPACE" .
        export AGENT_RELAY_ARCHIVE_SOURCE="$archive_source"
        bash scripts/install.sh
        uv_path="$(command -v uv || true)"
        if test -z "$uv_path"; then
          for candidate in "$HOME/.local/bin/uv" "$HOME/.cargo/bin/uv"; do
            if test -x "$candidate"; then
              uv_path="$candidate"
              export PATH="$(dirname "$candidate"):$PATH"
              break
            fi
          done
        fi
        test -n "$uv_path"
        tool_bin="$("$uv_path" tool dir --bin)"
        test -x "$tool_bin/agent-relay"
        printf 'RELAY_E2E_AGENT_RELAY_COMMAND=%s\n' "$tool_bin/agent-relay" >> "$GITHUB_ENV"
        printf '%s\n' "$(dirname "$uv_path")" >> "$GITHUB_PATH"
        printf '%s\n' "$tool_bin" >> "$GITHUB_PATH"

    - name: Install Agent Relay runtime through the Windows bootstrapper
      if: inputs.installer == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        AGENT_RELAY_SETUP: skip
        AGENT_RELAY_SKIP_PATH_UPDATE: "1"
        AGENT_RELAY_SYNC_ROOT: ${{ github.workspace }}
      run: |
        $ErrorActionPreference = "Stop"
        $archiveSource = Join-Path $env:RUNNER_TEMP "agent-relay-source.zip"
        Compress-Archive `
          -Path (Join-Path $env:GITHUB_WORKSPACE "*") `
          -DestinationPath $archiveSource `
          -Force
        $env:AGENT_RELAY_ARCHIVE_SOURCE = $archiveSource
        & "$env:GITHUB_WORKSPACE\scripts\install.ps1"
        $uvCommand = Get-Command uv -ErrorAction SilentlyContinue
        if ($null -eq $uvCommand) {
          $uvCandidates = @(
            (Join-Path $env:USERPROFILE ".local\bin\uv.exe"),
            (Join-Path $env:LOCALAPPDATA "uv\uv.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\uv\uv.exe")
          )
          $uvPath = $uvCandidates | Where-Object {
            Test-Path -LiteralPath $_ -PathType Leaf
          } | Select-Object -First 1
        } else {
          $uvPath = $uvCommand.Source
        }
        if ([string]::IsNullOrWhiteSpace($uvPath)) {
          throw "The uv command was not found after running the installer."
        }
        $env:Path = "$(Split-Path -Parent $uvPath);$env:Path"
        $toolBin = (& $uvPath tool dir --bin).Trim()
        $command = Join-Path $toolBin "agent-relay.exe"
        if (-not (Test-Path -LiteralPath $command -PathType Leaf)) {
          throw "The installed agent-relay command is missing: $command"
        }
        "RELAY_E2E_AGENT_RELAY_COMMAND=$command" | Add-Content -LiteralPath $env:GITHUB_ENV
        (Split-Path -Parent $uvPath) | Add-Content -LiteralPath $env:GITHUB_PATH
        $toolBin | Add-Content -LiteralPath $env:GITHUB_PATH
